name: Attachment qualification gates
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -m unittest discover -s simulateur/tests -p 'test_*.py'
      - run: python simulateur/scripts/build_attachment_catalogue.py
      - run: git diff --exit-code -- simulateur/data/attachment-catalogue.json
      - run: node --test simulateur/tests/attachment-engine.test.mjs
      - run: node --test simulateur/tests/body-startup-guard.test.mjs simulateur/tests/classic-startup-deadline.test.mjs
      - run: node --test simulateur/tests/metabolic-network.test.mjs simulateur/tests/metabolic-inquiry.test.mjs
      - run: node --test simulateur/tests/body-source-contract.test.mjs simulateur/tests/body-source-material-session.test.mjs simulateur/tests/brain-atlas-source.test.mjs simulateur/tests/hand-reference-source.test.mjs simulateur/tests/camera-navigation.test.mjs simulateur/tests/resident-occlusion.test.mjs
      - run: node --test simulateur/tests/body-light.test.mjs
      - run: node --test simulateur/tests/orbit-pointer-input.test.mjs
      - run: node --test simulateur/tests/reference-whole-profile.test.mjs
      - run: node --test simulateur/tests/historical-posture.test.mjs simulateur/tests/activity-props.test.mjs simulateur/tests/indexed-display-normals.test.mjs
      - run: node --test simulateur/tests/day-journal-store.test.mjs simulateur/tests/nerve-pilot-documentation.test.mjs simulateur/tests/bone-review-source.test.mjs simulateur/tests/cogitate-source.test.mjs simulateur/tests/recovered-source.test.mjs
      - run: node --test simulateur/tests/documentary-manifest.test.mjs simulateur/tests/regional-documentary.test.mjs simulateur/tests/regional-generic-heart.test.mjs simulateur/tests/regional-occlusion-targets.test.mjs simulateur/tests/neuromuscular-source.test.mjs
      - run: node --test simulateur/tests/body-source-attribution.test.mjs
      - name: Repackage original anatomical geometry into temporary source-verified chunks
        run: python simulateur/scripts/build_body_source_chunks.py --output-root "${{ runner.temp }}/poly-body-chunks" --verify
      - name: Verify on-demand anatomical block reader against real generated chunks
        env:
          POLY_CHUNKS_ROOT: ${{ runner.temp }}/poly-body-chunks
        run: node --test simulateur/tests/body-chunk-reader.test.mjs
      - name: Mount original geometry source chunks in experimental Three.js adapter
        env:
          POLY_CHUNKS_ROOT: ${{ runner.temp }}/poly-body-chunks
        run: node --test simulateur/tests/body-region-three.test.mjs simulateur/tests/body-regional-features.test.mjs
      - name: Build unpublished exact-value limbs and trunk reference blocks
        run: python simulateur/scripts/build_reference_source_chunks.py --output-root "${{ runner.temp }}/poly-reference-chunks" --verify
      - name: Verify all original reference numbers and metadata from candidate blocks
        env:
          POLY_REFERENCE_CHUNKS_ROOT: ${{ runner.temp }}/poly-reference-chunks
        run: node --test simulateur/tests/reference-source-reader.test.mjs simulateur/tests/reference-whole-reader.test.mjs simulateur/tests/reference-catalogue-relations.test.mjs simulateur/tests/reference-view-bookmark.test.mjs simulateur/tests/reference-selection.test.mjs simulateur/tests/reference-nerve-documentation.test.mjs simulateur/tests/reference-posture.test.mjs simulateur/tests/display-line-distances.test.mjs simulateur/tests/load-deadline.test.mjs
      - name: Build and independently verify separate skeleton source blocks
        run: |
          python simulateur/scripts/build_skeleton_source_chunks.py --output-root "${{ runner.temp }}/poly-skeleton-chunks" --verify
          node simulateur/scripts/verify_skeleton_source_chunks.mjs "${{ runner.temp }}/poly-skeleton-chunks"
      - name: Verify bounded independent skeleton reader
        env:
          POLY_SKELETON_CHUNKS_ROOT: ${{ runner.temp }}/poly-skeleton-chunks
        run: node --test simulateur/tests/skeleton-source-reader.test.mjs simulateur/tests/skeleton-selection.test.mjs simulateur/tests/skeleton-selection-loader.test.mjs simulateur/tests/avatar-skeleton-source.test.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        env:
          POLY_BROWSER_CHANNEL: chromium
          POLY_BASE_URL: http://127.0.0.1:8123
          POLY_CHUNKS_ROOT: ${{ runner.temp }}/poly-body-chunks
          POLY_REFERENCE_CHUNKS_ROOT: ${{ runner.temp }}/poly-reference-chunks
          POLY_SKELETON_CHUNKS_ROOT: ${{ runner.temp }}/poly-skeleton-chunks
        run: |
          python simulateur/scripts/serve_body_region_preview.py --port 8123 --chunks-root "$POLY_CHUNKS_ROOT" --reference-chunks-root "$POLY_REFERENCE_CHUNKS_ROOT" --skeleton-chunks-root "$POLY_SKELETON_CHUNKS_ROOT" > /tmp/poly-http.log 2>&1 &
          node simulateur/tests/attachments-browser.cjs
          node simulateur/tests/classic-controls-parity-browser.cjs
          node simulateur/tests/body-startup-browser.cjs
          node simulateur/tests/classic-startup-deadline-browser.cjs
          node simulateur/tests/body-light-browser.cjs
          node simulateur/tests/body-region-browser.cjs
          node simulateur/tests/body-regional-features-browser.cjs
          node simulateur/tests/body-regional-specialists-browser.cjs
          node simulateur/tests/body-regional-optics-browser.cjs
          node simulateur/tests/body-regional-brain-browser.cjs
          node simulateur/tests/body-regional-hand-browser.cjs
          node simulateur/tests/body-regional-nerves-browser.cjs
          node simulateur/tests/body-regional-nerve-protocols-browser.cjs
          node simulateur/tests/body-regional-cogitate-browser.cjs
          node simulateur/tests/body-regional-recovered-browser.cjs
          node simulateur/tests/body-regional-avatar-browser.cjs
          node simulateur/tests/body-regional-navigation-browser.cjs
          node simulateur/tests/body-regional-posture-browser.cjs
          node simulateur/tests/reference-region-browser.cjs
          node simulateur/tests/reference-interactions-browser.cjs
          node simulateur/tests/reference-workbench-browser.cjs
          node simulateur/tests/reference-whole-browser.cjs
          node simulateur/tests/reference-startup-browser.cjs
          node simulateur/tests/day-journal-browser.cjs
          node simulateur/tests/nerve-pilot-documentation-browser.cjs
          node simulateur/tests/documentary-manifest-browser.cjs
          node simulateur/tests/regional-documentary-browser.cjs
          node simulateur/tests/body-regional-documentary-graph-browser.cjs
          node simulateur/tests/regional-generic-heart-browser.cjs
          node simulateur/tests/regional-neuromuscular-browser.cjs
          node simulateur/tests/body-regional-startup-trace-browser.cjs
          node simulateur/tests/module-startup-browser.cjs
          node simulateur/tests/skeleton-region-browser.cjs
          node simulateur/tests/skeleton-interactions-browser.cjs
          node simulateur/tests/skeleton-whole-browser.cjs
          node simulateur/tests/skeleton-startup-browser.cjs
          node simulateur/tests/bone-review-browser.cjs
          node simulateur/tests/anatomy-page-return-browser.cjs
          node simulateur/tests/static-anatomy-input-browser.cjs
          node simulateur/tests/metabolic-network-browser.cjs
